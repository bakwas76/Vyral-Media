<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Work - Vyral Media</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/services.css">
    <link rel="stylesheet" href="../css/work.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="navbar" id="navbar">
        <div class="nav-container">

            <a href="../index.html" class="logo">
                <img src="/assests/img/logo.png" alt="">
            </a>

            <nav class="nav-links" id="navLinks">
                <a href="../index.html" class="nav-link">HOME</a>
                <a href="services.html" class="nav-link">SERVICES</a>
                <a href="about.html" class="nav-link">ABOUT US</a>
                <a href="our-work.html" class="nav-link active">OUR WORK</a>
            </nav>

            <a href="#" class="contact-btn">CONTACT US</a>

            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </header>





    <section class="ourwork-hero" id="ourWorkHero">
        <div class="ow-container">

            <div class="ow-slides-wrap">

                <div class="ow-slide active">
                    <video muted playsinline webkit-playsinline autoplay>
                        <source src="../assests/video/Advance.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="ow-slide">
                    <video muted playsinline webkit-playsinline>
                        <source src="../assests/video/Fajr.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="ow-slide">
                    <video muted playsinline webkit-playsinline>
                        <source src="../assests/video/Inventure .mp4" type="video/mp4">
                    </video>
                </div>

                <div class="ow-slide">
                    <video muted playsinline webkit-playsinline>
                        <source src="../assests/video/Solefine.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="ow-duration-line">
                    <div class="ow-duration-fill"></div>
                </div>

            </div>

            <button class="ow-nav-btn ow-prev" aria-label="Previous video">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="ow-nav-btn ow-next" aria-label="Next video">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <div class="ow-thumbs"></div>

        </div>
    </section>





    <footer class="site-footer">
        <h2 class="footer-heading">We make you visible.</h2>
        <div class="footer-info">
            <p><i class="fa-solid fa-phone"></i> +971 54 520 6506</p>
            <p><i class="fa-solid fa-globe"></i> www.vyral.ae</p>
            <p><i class="fa-solid fa-envelope"></i> Projects@vyral.ae</p>
            <p><i class="fa-solid fa-location-dot"></i> Business Bay, Dubai, United Arab Emirates</p>
        </div>
    </footer>





    <a href="https://wa.me/971545206506" target="_blank" class="whatsapp-float" aria-label="Chat on WhatsApp">
        <div id="whatsapp-lottie"></div>
    </a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        const navItems = navLinks.querySelectorAll('a');

        let isOpen = false;

        hamburger.addEventListener('click', () => {
            isOpen = !isOpen;
            hamburger.classList.toggle('active', isOpen);

            if (isOpen) {
                gsap.to(navLinks, {
                    height: 'auto',
                    paddingTop: 20,
                    paddingBottom: 20,
                    duration: 0.4,
                    ease: 'power2.out'
                });

                gsap.to(navItems, {
                    opacity: 1,
                    y: 0,
                    duration: 0.4,
                    stagger: 0.1,
                    delay: 0.15,
                    ease: 'power2.out'
                });

            } else {
                gsap.to(navItems, {
                    opacity: 0,
                    y: -15,
                    duration: 0.25,
                    stagger: 0.05,
                    ease: 'power2.in'
                });

                gsap.to(navLinks, {
                    height: 0,
                    paddingTop: 0,
                    paddingBottom: 0,
                    duration: 0.35,
                    delay: 0.15,
                    ease: 'power2.in'
                });
            }
        });

        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        lottie.loadAnimation({
            container: document.getElementById('whatsapp-lottie'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: '../assests/img/WhatsApp Icon.json'
        });
    </script>

    <script src="../js/work.js"></script>

</body>

</html>
